<script>
function syncT() { var c = document.documentElement.dataset.theme === 'adult' ? 'adult' : 'kids';
  document.querySelectorAll('[data-set-theme]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.setTheme === c); }); }
document.querySelectorAll('[data-set-theme]').forEach(function (b) {
  b.addEventListener('click', function () {
    if (b.dataset.setTheme === 'adult') document.documentElement.dataset.theme = 'adult'; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem('hb-theme', b.dataset.setTheme); } catch (e) {}
    syncT();
  });
});
syncT();
document.querySelectorAll('[data-lang]').forEach(function (a) {
  a.addEventListener('click', function () { try { localStorage.setItem('hb-lang', a.dataset.lang); } catch (e) {} });
});
</script>
